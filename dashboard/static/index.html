<!doctype html>
<html lang='en'>
<head>
 <meta charset='utf-8'>
 <meta name='viewport' content='width=device-width, initial-scale=1'>
 <title>Congress Dashboard</title>
 <link rel='stylesheet' href='/static/style.css'>
</head>
<body>
 <div class='site-glow' aria-hidden='true'></div>
 <div class='wrap'>
 <header class='topbar'>
 <div class='hero-copy'>
 <p class='eyebrow'>Local Congressional Archive</p>
 <h1>US Congress Committees Dashboard</h1>
 <p class='muted'>House and Senate committee signals arranged like a weathered wall record.</p>
 </div>
 <div class='hero-art' aria-hidden='true'>
 <span class='halo halo-one'></span>
 <span class='halo halo-two'></span>
 <span class='halo halo-three'></span>
 <span class='hanging-mark'></span>
 </div>
 <button id='refreshBtn' class='btn'>Refresh Source</button>
 </header>

 <section class='cards'>
 <article class='card'>
 <h2>Total Items</h2>
 <div id='totalItems' class='metric'>0</div>
 </article>
 <article class='card'>
 <h2>Today Items</h2>
 <div id='todayItems' class='metric'>0</div>
 </article>
 <article class='card'>
 <h2>Last Update</h2>
 <div id='lastUpdate' class='metric small'>-</div>
 </article>
 </section>

 <section class='panel'>
 <div class='panel-head'>
 <h3>Committee Activity</h3>
 <div class='filters'>
 <label>Chamber</label>
 <select id='chamberSelect'>
 <option value=''>All</option>
 <option value='House'>House</option>
 <option value='Senate'>Senate</option>
 </select>
 <label>Committee</label>
 <select id='committeeSelect'>
 <option value=''>All</option>
 </select>
 <label>Days</label>
 <select id='daysSelect'>
 <option value='7'>7</option>
 <option value='30' selected>30</option>
 <option value='90'>90</option>
 <option value='365'>365</option>
 </select>
 </div>
 </div>
 <div id='committeeBars' class='bars'></div>
 </section>

 <section class='panel'>
 <div class='panel-head'>
 <h3>Recent Items</h3>
 </div>
 <div class='table-wrap'>
 <table id='itemsTable'>
 <thead>
 <tr>
 <th>Date</th>
 <th>Chamber</th>
 <th>Committee</th>
 <th>Category</th>
 <th>Title</th>
 </tr>
 </thead>
 <tbody></tbody>
 </table>
 </div>
 </section>
 </div>
 <script src='/static/app.js'></script>
</body>
</html>
